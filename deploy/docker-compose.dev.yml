# Postgres for local development (optional if you already run one).
# Usage: docker compose -f deploy/docker-compose.dev.yml up -d
name: boasorte-dev

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: boasorte
      POSTGRES_PASSWORD: boasorte
      POSTGRES_DB: boasorte
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boasorte -d boasorte"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
