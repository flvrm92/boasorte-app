<button mat-stroked-button type="button" (click)="picker.click()">
  <svg lucideUpload aria-hidden="true"></svg>
  Importar .txt ou .csv
</button>
<input
  #picker
  type="file"
  accept=".txt,.csv,text/plain,text/csv"
  class="visually-hidden"
  tabindex="-1"
  aria-label="Arquivo de participantes"
  (change)="onFile($event)"
/>

@if (error(); as message) {
  <p class="error-text" role="alert">{{ message }}</p>
}

@if (table()) {
  <div class="columns" role="group" aria-labelledby="columns-title">
    <p id="columns-title" class="columns-title">
      <strong>{{ fileName() }}</strong> tem {{ labels().length }} colunas. Qual delas tem os participantes?
    </p>
    <app-field label="Coluna">
      <select appFieldControl [value]="column()" (change)="column.set(+$any($event.target).value)">
        @for (label of labels(); track $index) {
          <option [value]="$index" [selected]="$index === column()">{{ label }}</option>
        }
      </select>
    </app-field>
    <mat-checkbox [checked]="hasHeader()" (change)="hasHeader.set($event.checked)">A primeira linha é o cabeçalho</mat-checkbox>
    <div class="columns-actions">
      <button mat-flat-button type="button" (click)="useColumn()">Usar esta coluna</button>
      <button mat-button type="button" (click)="cancel()">Cancelar</button>
    </div>
  </div>
}
