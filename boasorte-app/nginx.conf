# Serves the Angular build. TLS and /api routing are done by Traefik (Dokploy) in front of this container.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Security headers (repeated in each location that sets its own headers, as nginx does not inherit them).
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Hashed build output: cache for a year.
    location ~* \.(?:js|css|woff2?|svg|png|webp)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Not hashed: must be revalidated so a new deploy is picked up.
    location = /theme-init.js {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
    }

    # SPA: every other route renders index.html, never cached.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Frame-Options DENY always;
    }
}
